dataset:
  # Use a clean prepared_root for each full prepare run. The prepare command
  # writes/copies files but does not fully clean old experiment outputs.
  raw_root: E:/dataset/raw_seedlings
  prepared_root: E:/dataset/prepared_seedlings
  class_names:
    - container
    - seedlings
  # Prepare rejects raw images whose names look like generated augmentations.
  # This protects val/test from near-duplicate leakage.
  augmented_name_markers:
    - _filter
    - _flip
    - _scale
    - _rotate
    - _crop
    - _brightness
    - _contrast
    - _color
    - _sharpness
    - _hflip
    - _vflip
  allow_augmented_source: false
  allow_split_integrity_issues: false
  split:
    train: 0.7
    val: 0.2
    test: 0.1
    seed: 42
    # Use a capture/tray/date group if filenames contain it.
    # Example: IMG_001_container3_aug -> group IMG_001
    group_regex: null
  augment_train:
    photometric:
      brightness: [0.75, 1.25, 1.5]
      contrast: [0.75, 1.25, 1.5]
      color: [0.75, 1.25]
      sharpness: [0.75, 1.5]
    hflip: false
    vflip: false

training:
  # yolo11n.pt may be downloaded by Ultralytics if it is not available locally.
  # In offline environments, replace this with a local .pt path.
  model: yolo11n.pt
  data: E:/dataset/prepared_seedlings/data.yaml
  project: runs
  # Use a new name for each independent run to avoid mixing artifacts.
  name: yolo11n_seedlings
  epochs: 200
  batch: 16
  imgsz: 640
  seed: 42
  deterministic: true
  device: null

validation:
  model: runs/yolo11n_seedlings/weights/best.pt
  data: E:/dataset/prepared_seedlings/data.yaml
  output_dir: runs/yolo11n_seedlings_eval
  imgsz: 640
  # Validation thresholds affect val/test_metrics.json, not predictions.json.
  conf: 0.25
  iou: 0.7
  run_after_train: true
  test_after_train: false

prediction:
  model: runs/yolo11n_seedlings/weights/best.pt
  images: E:/dataset/prepared_seedlings/test/images
  output_dir: runs/yolo11n_seedlings_test_predictions
  imgsz: 640
  # Prediction thresholds affect predictions.json. Rerun predict and
  # evaluate-cells after changing them.
  conf: 0.25
  iou: 0.7
  grid_rows: 11
  grid_cols: 11
  container_class: 0
  seedling_class: 1
  # These affect postprocessed containers/container_analysis in predictions.json.
  # The current evaluate-cells command still reads raw detections.
  min_container_area: 10000
  merge_distance: 50

evaluation:
  dataset: E:/dataset/prepared_seedlings
  split: test
  predictions: runs/yolo11n_seedlings_test_predictions/predictions.json
  output_dir: runs/yolo11n_seedlings_cell_eval
  grid_rows: 11
  grid_cols: 11
  container_class: 0
  seedling_class: 1
  # IoU threshold for matching predicted container boxes to labeled containers.
  # If matched_containers is 0 but visual boxes look close, inspect this value
  # and whether evaluation uses raw detections or postprocessed containers.
  container_iou: 0.5
  # Use "containers" to diagnose postprocessed container boxes from predictions.json.
  # Keep "detections" for the default end-to-end metric described in the protocol.
  container_prediction_source: detections
  target_match_distance_px: 25
  strict_predictions: true
  reject_augmented_eval_images: true
  # Set true to evaluate cell/seedling quality under known tray boxes.
  # This bypasses predicted-container matching and is not an end-to-end score.
  use_ground_truth_containers: false

baseline:
  images: E:/dataset/prepared_seedlings/test/images
  labels: E:/dataset/prepared_seedlings/test/labels
  output_dir: runs/baseline_green_test_predictions
  grid_rows: 11
  grid_cols: 11
  container_class: 0
  seedling_class: 1
  use_known_containers: true
  h_min: 25
  h_max: 95
  s_min: 35
  s_max: 255
  v_min: 30
  v_max: 255
  morph_kernel: 3
  min_seedling_area: 8
  max_seedling_area: 100000

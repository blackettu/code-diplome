env_id: SeedlingTrayEnv-v0
grid_rows: 11
grid_cols: 11
cell_size_mm: [33.0, 33.0]
max_objects: 256
max_targets: 128
scene_generator:
  p_empty: 0.65
  p_single_crop: 0.25
  p_multiple_crop: 0.07
  p_weed_present: 0.03
noise:
  bbox_center_sigma_mm: 1.0
  classification_error_prob: 0.03
  missed_detection_prob: 0.05
  false_positive_prob: 0.0
actuator:
  xy_sigma_mm: 0.8
  drift_sigma_mm: 0.2
  zone_error_prob: 0.0
  zone_error_mm: 0.0
reward:
  correct_remove: 10.0
  correct_review: 3.0
  move_mm_penalty: 0.01
  missed_target: -5.0
  unsafe_action: -100.0
  crop_damage: -50.0
safety:
  min_distance_to_keep_mm: 5.0
  max_uncertainty_mm: 2.0
render_mode: rgb_array

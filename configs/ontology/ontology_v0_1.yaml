  - remove_weed
  - remove_extra_crop
  - human_review_required
  - no_action
  - rescan
safety_labels:
  - safe_to_act
  - unsafe_to_act
  - calibration_required
  - foreign_object_present
attributes:
  - tiny
  - overlaps_neighbor_cell
  - occluded
  - low_confidence
  - foreign_object
